# mpv — leve e com o visual NOVA OS
vo=gpu
gpu-context=x11egl
hwdec=auto-safe
profile=fast
keep-open=yes
osc=yes
osd-font=Inter
osd-font-size=32
osd-color="#f1ecee"
osd-border-color="#131116"
sub-font=Inter
sub-font-size=44
sub-color="#f1ecee"
sub-border-color="#131116"
volume=70
save-position-on-quit=yes
