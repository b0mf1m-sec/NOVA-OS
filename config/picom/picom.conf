# Compositor NOVA OS — gerado; perfil: xrender
backend = "xrender";
vsync = true;
use-damage = false;
shadow = true;
shadow-radius = 30;
shadow-opacity = 0.34;
shadow-offset-x = -30;
shadow-offset-y = -20;
shadow-color = "#000000";
corner-radius = 12;
fading = true;
fade-delta = 5;
fade-in-step = 0.06;
fade-out-step = 0.06;
blur-background = false;
rules: (
  { match = "window_type = 'normal' || window_type = 'dialog' || window_type = 'utility'";
    animations = (
      # abrir: cresce com mola (passa um pouco do tamanho e assenta)
      { triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2,0,0,1)"; duration = 0.22; start = 0; end = "window-raw-opacity"; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.34,1.56,0.64,1)"; duration = 0.42; start = 0.78; end = 1; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width"; offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; },
      # fechar: encolhe e some
      { triggers = ["close"];
        opacity = { curve = "cubic-bezier(0.4,0,1,1)"; duration = 0.20; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.4,0,1,1)"; duration = 0.20; start = 1; end = 0.84; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width"; offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; },
      # minimizar: encolhe descendo em direção à dock
      { triggers = ["hide"];
        opacity = { curve = "cubic-bezier(0.4,0,1,1)"; duration = 0.30; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity"; shadow-opacity = "opacity";
        scale-x = { curve = "cubic-bezier(0.5,0,0.9,0.6)"; duration = 0.32; start = 1; end = 0.18; };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = { curve = "cubic-bezier(0.5,0,0.9,0.6)"; duration = 0.32; start = 0; end = "window-monitor-height - window-y - window-height * 0.18 - 70"; };
        shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y"; shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y"; }
    ); },
  { match = "class_g = 'Nova-central'"; corner-radius = 18;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2,0,0,1)"; duration = 0.18; start = 0; end = "window-raw-opacity"; };
        shadow-opacity = "opacity"; blur-opacity = "opacity";
        offset-y = { curve = "cubic-bezier(0.34,1.4,0.64,1)"; duration = 0.34; start = -26; end = 0; }; shadow-offset-y = "offset-y"; },
      { triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4,0,1,1)"; duration = 0.14; start = "window-raw-opacity-before"; end = 0; };
        shadow-opacity = "opacity"; blur-opacity = "opacity";
        offset-y = { duration = 0.14; start = 0; end = -14; }; shadow-offset-y = "offset-y"; }
    ); },
  { match = "class_g = 'Nova-apps'"; corner-radius = 0; shadow = false;
    animations = (
      { triggers = ["open", "show"];
        opacity = { curve = "cubic-bezier(0.2,0,0,1)"; duration = 0.26; start = 0; end = "window-raw-opacity"; };
        scale-x = { curve = "cubic-bezier(0.2,0.8,0.2,1)"; duration = 0.34; start = 1.12; end = 1; }; scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width"; offset-y = "(1 - scale-y) / 2 * window-height"; },
      { triggers = ["close", "hide"];
        opacity = { duration = 0.18; start = "window-raw-opacity-before"; end = 0; };
        scale-x = { duration = 0.18; start = 1; end = 1.08; }; scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width"; offset-y = "(1 - scale-y) / 2 * window-height"; }
    ); },
  { match = "window_type = 'dock'"; shadow = false; corner-radius = 0; fade = false; },
  { match = "class_g = 'Plank'"; blur-background = false; },
  { match = "class_g = 'Nova-papel' || window_type = 'desktop'"; shadow = false; corner-radius = 0; blur-background = false; fade = false; },
  { match = "window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    corner-radius = 9; shadow-radius = 14; shadow-offset-x = -14; shadow-offset-y = -9;
    animations = ( { triggers = ["open", "show"]; preset = "appear"; scale = 0.94; duration = 0.14; }, { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.97; duration = 0.10; } ); },
  { match = "class_g = 'XTerm'"; opacity = 0.96; },
  { match = "fullscreen"; corner-radius = 0; shadow = false; }
);
