# Compositor NOVA OS: perfil do Modo desempenho (sem animações, sem desfoque, sem sombras, sem esmaecer)
backend = "xrender";
vsync = true;
use-damage = true;
shadow = false;
fading = false;
blur-background = false;
corner-radius = 12;
rules: (
  { match = "class_g = 'Nova-central'"; corner-radius = 18; },
  { match = "class_g = 'Nova-apps'"; corner-radius = 0; },
  { match = "window_type = 'dock'"; corner-radius = 0; },
  { match = "class_g = 'Nova-papel' || window_type = 'desktop'"; corner-radius = 0; },
  { match = "window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'"; corner-radius = 9; },
  { match = "fullscreen"; corner-radius = 0; }
);
