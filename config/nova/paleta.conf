bg0=#131116        # fundo mais profundo (terminal, base)
bg1=#1c191f        # superfícies (barra, títulos de janela)
bg2=#28242c        # superfície elevada (menus, hover)
bg3=#3b3640        # bordas, separadores
fg0=#f1ecee        # texto principal
fg1=#a79fa8        # texto secundário
fg2=#6f6873        # texto desativado
# Acento
